<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14532d" />
    <title>You're offline — Cooachly</title>
    <style>
      :root { color-scheme: light dark; --fg: #171717; --bg: #ffffff; --muted: rgba(0,0,0,.6); --brand: #15803d; }
      @media (prefers-color-scheme: dark) { :root { --fg: #ededed; --bg: #0a0a0a; --muted: rgba(255,255,255,.6); --brand: #4ade80; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: Arial, Helvetica, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
      button { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 1rem; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Check your internet connection. Your bookings and messages will be here when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
